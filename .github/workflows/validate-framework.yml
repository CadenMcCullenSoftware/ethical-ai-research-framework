name: Validate framework

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate framework
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install coverage reporter
        run: python -m pip install coverage

      - name: Run unit tests with branch coverage
        run: python -m coverage run --branch --source=scripts -m unittest discover -s tests -v

      - name: Validate source points and examples
        run: python scripts/validate_framework.py

      - name: Report coverage and enforce minimum
        run: |
          python -m coverage report --include="scripts/validate_framework.py" --fail-under=90 --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14
